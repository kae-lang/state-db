name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: smql

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            tool: cargo
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            tool: cargo
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            tool: cross
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            tool: cross
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            tool: cargo
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        working-directory: smql-engine
        run: |
          ${{ matrix.tool }} build --release --bin smql --target ${{ matrix.target }} --features "rocksdb,auth"

      - name: Determine paths
        id: paths
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="smql-${VERSION}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            echo "archive=${ARCHIVE_NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Binary path
          if [ "${{ matrix.archive }}" = "zip" ]; then
            echo "binary=smql-engine/target/${{ matrix.target }}/release/smql.exe" >> "$GITHUB_OUTPUT"
          else
            echo "binary=smql-engine/target/${{ matrix.target }}/release/smql" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p staging
          cp ${{ steps.paths.outputs.binary }} staging/smql
          cp LICENSE staging/
          tar czf ${{ steps.paths.outputs.archive }} -C staging .

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p staging
          cp ${{ steps.paths.outputs.binary }} staging/smql.exe
          cp LICENSE staging/
          cd staging && 7z a -tzip ../${{ steps.paths.outputs.archive }} .

      - name: Generate checksum
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 ${{ steps.paths.outputs.archive }} > ${{ steps.paths.outputs.archive }}.sha256
          else
            sha256sum ${{ steps.paths.outputs.archive }} > ${{ steps.paths.outputs.archive }}.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.archive_name }}
          path: |
            ${{ steps.paths.outputs.archive }}
            ${{ steps.paths.outputs.archive }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
