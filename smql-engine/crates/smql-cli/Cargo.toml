[package]
name = "smql-cli"
version = "0.1.0"
edition.workspace = true
description = "CLI and REPL for the SMQL state-machine database engine"
license.workspace = true
repository.workspace = true

[[bin]]
name = "smql"
path = "src/main.rs"

[features]
rocksdb = ["smql-storage/rocksdb", "smql-server/rocksdb"]
auth = ["smql-server/auth"]

[dependencies]
smql-ast = { path = "../smql-ast" }
smql-catalog = { path = "../smql-catalog" }
smql-engine-core = { path = "../smql-engine" }
smql-parser = { path = "../smql-parser" }
smql-server = { path = "../smql-server" }
smql-storage = { path = "../smql-storage" }
smql-codegen = { path = "../smql-codegen" }
clap = { workspace = true }
rustyline = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
