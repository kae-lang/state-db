[package]
name = "smql-server"
version = "0.1.0"
edition.workspace = true

[features]
rocksdb = ["smql-storage/rocksdb"]
auth = ["dep:jsonwebtoken"]

[dependencies]
smql-ast = { path = "../smql-ast" }
smql-catalog = { path = "../smql-catalog" }
smql-engine-core = { path = "../smql-engine" }
smql-hooks = { path = "../smql-hooks" }
smql-parser = { path = "../smql-parser" }
smql-storage = { path = "../smql-storage" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
jsonwebtoken = { workspace = true, optional = true }
chrono = { workspace = true }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { workspace = true }
