[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "1"
anyhow = "1"
# Parsing
winnow = "0.6"
# Storage
rocksdb = "0.22"
# HTTP server
axum = "0.7"
tower = "0.4"
# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "14"
# Observability
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.13"
# Utilities
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
bytes = "1"
ulid = { version = "1", features = ["serde"] }
async-trait = "0.1"
